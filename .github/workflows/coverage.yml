name: Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          set +e
          PYTHONPATH=. python -m pytest --cov=src --cov-report=term-missing --cov-report=markdown:coverage.md --cov-fail-under=85
          status=$?
          if [ -f coverage.md ]; then
            {
              echo '## Coverage report'
              cat coverage.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"